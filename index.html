<style>
/* =========================
   ORIGEN · HEADER + HERO
========================= */

header{

}

.nav{

.hero{

  align-items:flex-end;
}

  position:absolute;

  pointer-events:none;

  background:

.hero-content{

}

  font-weight:300;

  text-shadow:

.hero-description{

  margin-bottom:30px;

  text-shadow:

}

.hero-buttons{

  gap:14px;
  flex-wrap:wrap;
}

.hero-button{

  align-items:center;

}

.hero-button:hover{

  color:#050d14;
}

.hero-logo-water{

  left:0;
  bottom:3vh;

  width:225px;

  z-index:3;

  pointer-events:none;

  filter:

  opacity:.96;
}

.hero-logo-water img{
  width:100%;
  height:auto;
  display:block;
}

/* MOBILE */

@media(max-width:800px){

  .nav{
    justify-content:center;
  }

  .navlinks{
    gap:14px;
    font-size:9px;
  }

  .hero-content{
    padding-bottom:20vh;
  }

  .hero h1{
    font-size:58px;
  }

  .hero-logo-water{
    width:165px;
    bottom:3vh;
  }

@media(max-width:520px){

  .navlinks{
    display:none;
  }

  .hero h1{
    font-size:52px;
  }

  .hero-description{
    font-size:16px;
  }

  .hero-logo-water{

  }
