<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORIGEN SURFACES | Superficies · Materiales · Soluciones</title>

<meta name="description" content="ORIGEN SURFACES. Superficies, materiales y soluciones para transformar espacios.">

<style>

:root{
  --fondo:#f7f4ee;
  --fondo-verde:#eef1ec;
  --verde:#34473f;
  --verde-suave:#53655d;
  --texto:#41423e;
  --arena:#e6ddce;
  --blanco:#fffdf9;
  --linea:rgba(52,71,63,.16);
  --error-fondo:#f6e2df;
  --error-texto:#8a3d35;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--fondo);
  color:var(--texto);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
select{
  font:inherit;
}

.container{
  width:min(1320px,calc(100% - 100px));
  margin:auto;
}


/* =========================
   NAV
========================= */

header{
  height:96px;
  border-bottom:1px solid var(--linea);
  background:rgba(247,244,238,.96);
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:var(--verde);
  font-weight:700;
  font-size:25px;
  letter-spacing:.30em;
  line-height:1;
}

.logo span{
  display:block;
  font-size:9px;
  letter-spacing:.48em;
  margin-top:10px;
}

.menu{
  display:flex;
  gap:40px;
  color:#666862;
  font-size:15px;
}

.menu a{
  transition:.25s ease;
}

.menu a:hover{
  color:var(--verde);
}


/* =========================
   BOTONES
========================= */

.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:max-content;
  min-height:54px;
  padding:0 30px;
  border:0;
  background:var(--verde-suave);
  color:white;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  letter-spacing:.17em;
  transition:.25s ease;
}

.button:hover{
  background:var(--verde);
  transform:translateY(-2px);
}


/* =========================
   TIPOGRAFÍA
========================= */

.eyebrow{
  font-size:12px;
  letter-spacing:.38em;
  color:#64746d;
  margin-bottom:32px;
}

h1,
h2,
h3{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  color:var(--verde);
}

h1 em,
h2 em,
h3 em{
  font-style:italic;
}


/* =========================
   HERO
========================= */

.hero{
  min-height:calc(100vh - 96px);
  display:grid;
  grid-template-columns:1fr 1fr;
}

.hero-copy{
  padding:110px 9%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(
    135deg,
    #f7f4ee 0%,
    #eee8dc 100%
  );
}

.hero h1{
  font-size:clamp(58px,6vw,94px);
  line-height:.92;
  letter-spacing:-.045em;
  max-width:650px;
}

.hero-subtitle{
  font-family:Georgia,"Times New Roman",serif;
  font-size:34px;
  line-height:1.12;
  color:#344b56;
  margin:42px 0 28px;
  max-width:500px;
}

.hero-text{
  max-width:590px;
  font-size:17px;
  color:#5f6561;
  margin-bottom:38px;
}

.hero-photo{
  height:calc(100vh - 96px);
  min-height:calc(100vh - 96px);
  background:#e8e3da;
  overflow:hidden;
}

.hero-photo img{
  object-position:center center;
}


/* =========================
   INTRO
========================= */

.intro{
  padding:150px 0;
  background:var(--blanco);
}

.intro-grid{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:100px;
  align-items:start;
}

.intro h2{
  font-size:clamp(46px,5vw,78px);
  line-height:.98;
  letter-spacing:-.04em;
}

.intro-text{
  max-width:650px;
  font-size:19px;
  line-height:1.75;
  color:#656963;
  padding-top:15px;
}


/* =========================
   PISCINAS
========================= */

.piscinas{
  background:var(--fondo-verde);
  padding:130px 0;
}

.piscina-grid{
  display:grid;
  grid-template-columns:1.05fr 1fr;
  min-height:650px;
  align-items:stretch;
}

.piscina-photo{
  min-height:650px;
  overflow:hidden;
}

.piscina-copy{
  background:#e9eee9;
  padding:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.piscina-copy .eyebrow{
  margin-bottom:25px;
}

.piscina-copy h2{
  font-size:clamp(48px,5vw,76px);
  line-height:.98;
  letter-spacing:-.045em;
  max-width:600px;
}

.piscina-copy p{
  max-width:580px;
  margin:35px 0;
  color:#59615d;
  font-size:17px;
}


/* =========================
   CALCULADORA ORIGEN
========================= */

.calculadora-piscina{
  margin-top:80px;
  padding:90px 70px;
  background:var(--verde);
  color:var(--blanco);

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:start;
}

.calculadora-intro{
  max-width:620px;
}

.calculadora-intro .eyebrow{
  color:#b8c9c0;
  margin-bottom:25px;
}

.calculadora-intro h2{
  color:white;
  font-size:clamp(48px,5vw,76px);
  line-height:.98;
  letter-spacing:-.045em;
  margin-bottom:30px;
}

.calculadora-intro p{
  max-width:520px;
  color:#dce5e0;
  font-size:18px;
  line-height:1.6;
}


/* FORMULARIO */

.calculadora-form{
  background:#eef2ee;
  color:var(--texto);
  padding:45px;

  display:flex;
  flex-direction:column;
  gap:25px;
}

.campo{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.campo label{
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em;
}

.campo input,
.campo select{
  width:100%;
  min-height:54px;
  padding:16px 18px;

  border:1px solid #c9d1cc;
  border-radius:8px;

  outline:none;
  background:#fff;
  color:var(--texto);

  font-size:16px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.campo input:focus,
.campo select:focus{
  border-color:var(--verde-suave);
  box-shadow:0 0 0 4px rgba(83,101,93,.10);
}

.campo span{
  font-size:13px;
  color:#6b7771;
}


/* ERROR */

.error-calculadora{
  display:none;
  padding:15px;

  border-radius:8px;

  background:var(--error-fondo);
  color:var(--error-texto);

  font-size:14px;
  line-height:1.5;
}

.error-calculadora.activo{
  display:block;
}


/* RESULTADO */

.resultado-piscina{
  grid-column:1 / -1;

  background:#f7f4ee;
  color:var(--texto);

  padding:45px;

  display:none;
}

.resultado-piscina.activo{
  display:block;
}

.resultado-titulo{
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:30px;
  color:#597068;
}

.resultado-datos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px;
  margin-bottom:35px;
}

.resultado-datos div{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.resultado-datos span{
  font-size:13px;
  color:#69756f;
}

.resultado-datos strong{
  font-size:25px;
  font-weight:500;
  color:var(--verde);
}

.whatsapp-button{
  background:#53655d;
}

.whatsapp-button:hover{
  background:#34473f;
}


/* =========================
   MATERIA
========================= */

.materia{
  padding:140px 0;
  background:var(--blanco);
}

.materia-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:80px;
  align-items:stretch;
}

.materia-photo{
  min-height:650px;
  background:#e7e1d5;
  overflow:hidden;
}

.materia-copy{
  background:var(--arena);
  padding:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.materia-copy h2{
  font-size:clamp(50px,5vw,80px);
  line-height:.96;
  letter-spacing:-.045em;
}

.materia-copy p{
  margin-top:38px;
  max-width:500px;
  color:#666b65;
  font-size:17px;
}


/* =========================
   PROYECTOS
========================= */

.proyectos{
  padding:140px 0;
  background:#f1eee8;
}

.proyectos-head{
  margin-bottom:55px;
}

.proyectos h2{
  font-size:clamp(50px,5vw,76px);
  line-height:1;
}

.proyecto{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  min-height:600px;
}

.proyecto-photo{
  min-height:600px;
  overflow:hidden;
}

.proyecto-copy{
  background:var(--verde);
  color:white;
  padding:70px;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.proyecto-copy .eyebrow{
  color:#d9e0dc;
}

.proyecto-copy h3{
  color:white;
  font-size:48px;
  line-height:1;
  margin-bottom:25px;
}

.proyecto-copy p{
  color:#d9dfdb;
  font-size:16px;
}


/* =========================
   ORIGEN
========================= */

.origen{
  padding:170px 0;
  background:var(--fondo);
}

.origen-inner{
  max-width:1150px;
}

.origen h2{
  font-size:clamp(58px,7vw,105px);
  line-height:.92;
  letter-spacing:-.055em;
}

.origen p{
  max-width:850px;
  margin-top:48px;
  font-size:20px;
  line-height:1.75;
  color:#626762;
}


/* =========================
   CONTACTO
========================= */

.contacto{
  padding:120px 0;
  background:var(--verde);
  color:white;
}

.contacto h2{
  color:white;
  font-size:clamp(55px,6vw,90px);
  line-height:.95;
}

.contacto p{
  max-width:600px;
  margin:30px 0 40px;
  color:#d8dfdb;
  font-size:18px;
}

.contacto .button{
  background:white;
  color:var(--verde);
}


/* =========================
   FOOTER
========================= */

footer{
  padding:35px 0;
  background:#293a34;
  color:#cfd6d1;
  font-size:12px;
  letter-spacing:.12em;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  header{
    height:80px;
  }

  .container{
    width:min(100% - 40px,700px);
  }

  .menu{
    gap:15px;
    font-size:12px;
  }

  .logo{
    font-size:20px;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .hero-copy{
    padding:80px 30px;
    min-height:650px;
  }

  .hero-photo{
    min-height:500px;
  }

  .intro,
  .piscinas,
  .materia,
  .proyectos,
  .origen{
    padding:90px 0;
  }

  .intro-grid,
  .piscina-grid,
  .materia-grid,
  .proyecto{
    grid-template-columns:1fr;
    gap:0;
  }

  .piscina-photo,
  .materia-photo,
  .proyecto-photo{
    min-height:450px;
  }

  .piscina-copy,
  .materia-copy,
  .proyecto-copy{
    padding:60px 35px;
  }

  .proyecto-copy{
    min-height:400px;
  }

  .calculadora-piscina{
    grid-template-columns:1fr;
    padding:70px 30px;
  }

  .resultado-piscina{
    grid-column:auto;
  }

  .resultado-datos{
    grid-template-columns:1fr 1fr;
  }

  .footer-inner{
    flex-direction:column;
    gap:15px;
  }

}


@media(max-width:600px){

  .menu{
    display:none;
  }

  .hero h1{
    font-size:58px;
  }

  .hero-subtitle{
    font-size:28px;
  }

  .hero-copy{
    padding:70px 25px;
  }

  .intro-grid{
    gap:35px;
  }

  .piscina-copy h2,
  .materia-copy h2,
  .proyectos h2{
    font-size:52px;
  }

  .<script>

const largoInput = document.getElementById("largo");
const anchoInput = document.getElementById("ancho");
const revestimientoInput = document.getElementById("revestimiento");

const botonCalcular = document.getElementById("boton-calcular");

const error = document.getElementById("error-calculadora");
const resultado = document.getElementById("resultado-piscina");

const whatsapp = document.getElementById("whatsapp-calculadora");


/* ================================
   LIMPIAR AL CAMBIAR DATOS
================================ */

function limpiarCalculadora() {

  error.textContent = "";
  error.classList.remove("activo");

  resultado.classList.remove("activo");

  whatsapp.href = "#";

}


largoInput.addEventListener(
  "input",
  limpiarCalculadora
);


anchoInput.addEventListener(
  "input",
  limpiarCalculadora
);


revestimientoInput.addEventListener(
  "change",
  limpiarCalculadora
);


/* ================================
   BOTÓN CALCULAR
================================ */

botonCalcular.addEventListener(
  "click",
  calcularPiscina
);


/* ================================
   CALCULADORA
================================ */

function calcularPiscina() {

  error.textContent = "";
  error.classList.remove("activo");

  resultado.classList.remove("activo");


  /* DATOS */

  const largo = parseFloat(
    String(largoInput.value).replace(",", ".")
  );


  const ancho = parseFloat(
    String(anchoInput.value).replace(",", ".")
  );


  const revestimiento =
    revestimientoInput.value;


  const opcion =
    revestimientoInput.options[
      revestimientoInput.selectedIndex
    ];


  /* ================================
     VALIDACIONES
  ================================= */

  if (!Number.isFinite(largo) || largo <= 0) {

    mostrarError(
      "Ingresá un largo mayor a cero."
    );

    return;
  }


  if (!Number.isFinite(ancho) || ancho <= 0) {

    mostrarError(
      "Ingresá un ancho mayor a cero."
    );

    return;
  }


  if (!revestimiento || !opcion) {

    mostrarError(
      "Elegí el revestimiento que querés para tu piscina."
    );

    return;
  }


  /* ================================
     RENDIMIENTO DEL PRODUCTO
  ================================= */

  const rendimiento = parseFloat(
    opcion.dataset.rendimiento
  );


  if (!Number.isFinite(rendimiento) || rendimiento <= 0) {

    mostrarError(
      "No se pudo obtener el rendimiento del revestimiento seleccionado."
    );

    return;
  }


  /* ================================
     1. SUPERFICIE REAL
     
     LARGO × ANCHO
  ================================= */

  const superficieReal =
    largo * ancho;


  /* ================================
     2. 10% DE DESPERDICIO

     REDONDEAMOS A 2 DECIMALES
     PARA EVITAR ERRORES DE PRECISIÓN
     DE JAVASCRIPT.
  ================================= */

  const superficieDesperdicio =
    Math.round(
      (superficieReal * 1.10) * 100
    ) / 100;


  /* ================================
     3. CAJAS

     SIEMPRE HACIA ARRIBA
  ================================= */

  const cajas =
    Math.ceil(
      superficieDesperdicio /
      rendimiento
    );


  /* ================================
     4. METROS REALMENTE COMPRADOS
  ================================= */

  const metrosComprados =
    Math.round(
      (cajas * rendimiento) * 100
    ) / 100;


  /* ================================
     NOMBRE DEL PRODUCTO
  ================================= */

  const nombreProducto =
    opcion.textContent.trim();


  /* ================================
     MOSTRAR RESULTADOS
  ================================= */

  document
    .getElementById("resultado-superficie")
    .textContent =
      formatearNumero(
        superficieReal
      ) + " m²";


  document
    .getElementById("resultado-desperdicio")
    .textContent =
      formatearNumero(
        superficieDesperdicio
      ) + " m²";


  document
    .getElementById("resultado-cajas")
    .textContent =
      cajas +
      (
        cajas === 1
          ? " caja"
          : " cajas"
      );


  document
    .getElementById("resultado-m2")
    .textContent =
      formatearNumero(
        metrosComprados
      ) + " m²";


  /* ================================
     WHATSAPP
  ================================= */

  const mensaje =
`Hola ORIGEN, quiero cotizar mi piscina.

Revestimiento: ${nombreProducto}

Largo: ${formatearNumero(largo)} m
Ancho: ${formatearNumero(ancho)} m

Superficie real: ${formatearNumero(superficieReal)} m²
Superficie con 10% de desperdicio: ${formatearNumero(superficieDesperdicio)} m²

Cajas a comprar: ${cajas}
Total de m² que voy a comprar: ${formatearNumero(metrosComprados)} m²`;


  const numeroWhatsApp =
    "5491147004804";


  whatsapp.href =
    "https://wa.me/" +
    numeroWhatsApp +
    "?text=" +
    encodeURIComponent(mensaje);


  /* MOSTRAR RESULTADO */

  resultado.classList.add("activo");


  /* LLEVAR AL RESULTADO */

  setTimeout(function () {

    resultado.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }, 100);

}


/* ================================
   MENSAJE DE ERROR
================================ */

function mostrarError(mensaje) {

  error.textContent = mensaje;

  error.classList.add("activo");

  resultado.classList.remove("activo");

}


/* ================================
   FORMATO ARGENTINO
================================ */

function formatearNumero(numero) {

  return numero.toLocaleString(
    "es-AR",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );

}

</script>

</body>
</html>
