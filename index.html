<script>
/* =========================================================
   ORIGEN · LOGO REAL
========================================================= */

(function(){

  const logoPath =
    "fotos/ChatGPT%20Image%2022%20sept%202026,%2007_38_47%20p.m..png";


  /* =========================
     LOGO ARRIBA
  ========================= */

  const header =
    document.querySelector("header");

  if(header){

    let logo =
      header.querySelector(".logo-real");

    if(!logo){

      const oldLogo =
        header.querySelector(".logo");

      logo =
        document.createElement("a");

      logo.className =
        "logo-real";

      logo.href =
        "#inicio";

      logo.setAttribute(
        "aria-label",
        "ORIGEN SURFACES"
      );

      const img =
        document.createElement("img");

      img.src =
        logoPath;

      img.alt =
        "ORIGEN SURFACES";

      logo.appendChild(img);

      if(oldLogo){

        oldLogo.replaceWith(logo);

      }else{

        const nav =
          header.querySelector(".nav");

        if(nav){
          nav.prepend(logo);
        }

      }

    }

  }


  /* =========================
     LOGO SOBRE EL AGUA
  ========================= */

  const hero =
    document.querySelector(".hero");

  if(hero){

    let waterLogo =
      hero.querySelector(
        ".hero-logo-water"
      );

    if(!waterLogo){

      waterLogo =
        document.createElement("div");

      waterLogo.className =
        "hero-logo-water";

      const img =
        document.createElement("img");

      img.src =
        logoPath;

      img.alt =
        "";

      waterLogo.appendChild(img);

      hero.appendChild(waterLogo);

    }else{

      const img =
        waterLogo.querySelector("img");

      if(img){
        img.src =
          logoPath;
      }

    }

  }


  /* =========================
     HEADER SCROLL
  ========================= */

  if(header){

    window.addEventListener(
      "scroll",
      function(){

        header.classList.toggle(
          "scrolled",
          window.scrollY > 40
        );

      }
    );

  }

})();
</script>
