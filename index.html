/* =========================================================
   ORIGEN SURFACES — WOW EXPERIENCE
   Pegar al FINAL del <style>
========================================================= */

:root{
  --wow-dark:#18221f;
  --wow-green:#34473f;
  --wow-cream:#f5f1e9;
  --wow-line:rgba(255,255,255,.16);
}

/* ---------- CURSOR ---------- */
<!-- =====================================================
     ORIGEN SURFACES — WOW ENGINE
===================================================== -->

<div class="wow-progress"></div>
<div class="wow-cursor"></div>
<div class="wow-cursor-ring"></div>

<script>

(function(){

  /* -----------------------------
     SCROLL PROGRESS
  ----------------------------- */

  const progress = document.querySelector('.wow-progress');

  function updateProgress(){

    const scrollTop = window.scrollY;
    const height =
      document.documentElement.scrollHeight -
      window.innerHeight;

    const percentage =
      height > 0 ? (scrollTop / height) * 100 : 0;

    progress.style.width = percentage + '%';

  }

  window.addEventListener('scroll', updateProgress, {passive:true});
  updateProgress();


  /* -----------------------------
     SMART NAV
  ----------------------------- */

  const header = document.querySelector('header');

  function updateHeader(){

    if(window.scrollY > 80){
      header.classList.add('wow-scrolled');
    }else{
      header.classList.remove('wow-scrolled');
    }

  }

  window.addEventListener('scroll', updateHeader, {passive:true});
  updateHeader();


  /* -----------------------------
     CURSOR
  ----------------------------- */

  const cursor = document.querySelector('.wow-cursor');
  const ring = document.querySelector('.wow-cursor-ring');

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;

  let ringX = mouseX;
  let ringY = mouseY;

  window.addEventListener('mousemove', function(e){

    mouseX = e.clientX;
    mouseY = e.clientY;

    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';

  });

  function animateCursor(){

    ringX += (mouseX - ringX) * .15;
    ringY += (mouseY - ringY) * .15;

    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';

    requestAnimationFrame(animateCursor);

  }

  animateCursor();


  /* -----------------------------
     INTERACTIVE ELEMENTS
  ----------------------------- */

  document.querySelectorAll(
    'a, button, input, select, .producto-card'
  ).forEach(el => {

    el.addEventListener('mouseenter', () => {
      document.body.classList.add('wow-hover');
    });

    el.addEventListener('mouseleave', () => {
      document.body.classList.remove('wow-hover');
    });

  });


  /* -----------------------------
     REVEAL ON SCROLL
  ----------------------------- */

  const revealTargets = document.querySelectorAll(
    '.intro-grid, .piscina-grid, .calculadora-piscina, ' +
    '.materia-grid, .proyectos, .origen-inner, ' +
    '.contacto > .container, .wow-head, .wow-cat, ' +
    '.producto-card'
  );

  revealTargets.forEach(el => {
    el.classList.add('wow-reveal');
  });

  const observer = new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        if(entry.isIntersecting){

          entry.target.classList.add('wow-visible');

          observer.unobserve(entry.target);

        }

      });

    },
    {
      threshold:.12,
      rootMargin:'0px 0px -60px 0px'
    }
  );

  revealTargets.forEach(el => observer.observe(el));


  /* -----------------------------
     PARALLAX HERO
  ----------------------------- */

  const heroImage =
    document.querySelector('.hero-photo img');

  window.addEventListener('scroll', function(){

    if(!heroImage) return;

    const y = window.scrollY;

    if(y < window.innerHeight){

      heroImage.style.transform =
        'scale(1.04) translateY(' +
        (y * .10) +
        'px)';

    }

  }, {passive:true});


  /* -----------------------------
     MAGNETIC BUTTONS
  ----------------------------- */

  document.querySelectorAll('.button').forEach(button => {

    button.addEventListener('mousemove', function(e){

      const rect = button.getBoundingClientRect();

      const x =
        e.clientX -
        rect.left -
        rect.width / 2;

      const y =
        e.clientY -
        rect.top -
        rect.height / 2;

      button.style.transform =
        'translate(' +
        (x * .08) +
        'px,' +
        (y * .08) +
        'px)';

    });

    button.addEventListener('mouseleave', function(){

      button.style.transform = '';

    });

  });


  /* -----------------------------
     CATEGORY HOVER
  ----------------------------- */

  document.querySelectorAll('.wow-cat').forEach(card => {

    card.addEventListener('mouseenter', function(){

      document.querySelectorAll('.wow-cat')
        .forEach(other => {

          if(other !== card){
            other.style.filter =
              'brightness(.65)';

          }

        });

    });

    card.addEventListener('mouseleave', function(){

      document.querySelectorAll('.wow-cat')
        .forEach(other => {

          other.style.filter = '';

        });

    });

  });


  /* -----------------------------
     SMOOTH ANCHOR
  ----------------------------- */

  document.querySelectorAll('a[href^="#"]').forEach(link => {

    link.addEventListener('click', function(e){

      const target =
        document.querySelector(
          this.getAttribute('href')
        );

      if(!target) return;

      e.preventDefault();

      target.scrollIntoView({
        behavior:'smooth',
        block:'start'
      });

    });

  });


  /* -----------------------------
     IMAGE TILT
  ----------------------------- */

  document.querySelectorAll(
    '.wow-cat, .producto-card'
  ).forEach(card => {

    card.addEventListener('mousemove', function(e){

      if(window.innerWidth < 900) return;

      const rect =
        card.getBoundingClientRect();

      const x =
        (e.clientX - rect.left) /
        rect.width - .5;

      const y =
        (e.clientY - rect.top) /
        rect.height - .5;

      card.style.transform =
        'perspective(1000px) ' +
        'rotateX(' + (-y * 2) + 'deg) ' +
        'rotateY(' + (x * 2) + 'deg) ' +
        'translateY(-5px)';

    });

    card.addEventListener('mouseleave', function(){

      card.style.transform = '';

    });

  });

})();

</script>
body{
  cursor:default;
}

.wow-cursor{
  position:fixed;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  mix-blend-mode:difference;
  pointer-events:none;
  z-index:9999;
  transform:translate(-50%,-50%);
  transition:
    width .25s ease,
    height .25s ease,
    opacity .25s ease;
}

.wow-cursor-ring{
  position:fixed;
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.7);
  border-radius:50%;
  pointer-events:none;
  z-index:9998;
  transform:translate(-50%,-50%);
  transition:
    width .35s cubic-bezier(.22,1,.36,1),
    height .35s cubic-bezier(.22,1,.36,1);
}

body.wow-hover .wow-cursor{
  width:5px;
  height:5px;
}

body.wow-hover .wow-cursor-ring{
  width:75px;
  height:75px;
}

/* ---------- GRAIN ---------- */

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9997;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

/* ---------- SCROLL PROGRESS ---------- */

.wow-progress{
  position:fixed;
  top:0;
  left:0;
  height:2px;
  width:0;
  background:#fff;
  z-index:10000;
  mix-blend-mode:difference;
}

/* ---------- NAV ---------- */

header{
  height:82px;
  background:transparent;
  border-bottom:1px solid transparent;
  position:fixed;
  width:100%;
  transition:
    background .5s ease,
    border .5s ease,
    backdrop-filter .5s ease;
}

header.wow-scrolled{
  background:rgba(24,34,31,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.1);
}

header.wow-scrolled .logo,
header.wow-scrolled .menu{
  color:#fff;
}

.nav{
  position:relative;
}

/* ---------- HERO ---------- */

.hero{
  min-height:100svh;
  height:100svh;
  display:block;
  position:relative;
  overflow:hidden;
  background:#18221f;
}

.hero-copy{
  position:absolute;
  z-index:3;
  inset:0;
  padding:0 7vw;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  flex-direction:column;
  background:
    linear-gradient(
      90deg,
      rgba(10,18,15,.76) 0%,
      rgba(10,18,15,.38) 48%,
      rgba(10,18,15,.05) 100%
    );
}

.hero-photo{
  position:absolute;
  inset:0;
  height:100%;
  min-height:0;
  overflow:hidden;
}

.hero-photo:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.28),
      transparent 35%,
      rgba(0,0,0,.25)
    );
}

.hero-photo img{
  transform:scale(1.08);
  animation:heroZoom 14s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes heroZoom{
  from{transform:scale(1.12)}
  to{transform:scale(1)}
}

.hero .eyebrow{
  color:rgba(255,255,255,.72);
  letter-spacing:.42em;
  margin-bottom:30px;
}

.hero h1{
  color:#fff;
  font-size:clamp(70px,10vw,160px);
  line-height:.82;
  max-width:900px;
  letter-spacing:-.07em;
  text-shadow:0 20px 60px rgba(0,0,0,.2);
}

.hero h1 em{
  color:#d9e2dc;
}

.hero-subtitle{
  color:#fff;
  font-size:clamp(25px,3vw,44px);
  max-width:600px;
  margin:35px 0 20px;
}

.hero-text{
  color:rgba(255,255,255,.78);
  max-width:520px;
}

.hero .button{
  margin-top:10px;
  background:#fff;
  color:#24342e;
  border:1px solid #fff;
  position:relative;
  overflow:hidden;
}

.hero .button:before{
  content:"";
  position:absolute;
  inset:0;
  background:#34473f;
  transform:translateY(100%);
  transition:transform .45s cubic-bezier(.16,1,.3,1);
}

.hero .button:hover:before{
  transform:translateY(0);
}

.hero .button{
  isolation:isolate;
}

.hero .button{
  z-index:1;
}

.hero .button::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
}

/* ---------- HERO LABEL ---------- */

.hero:before{
  content:"ORIGEN / SURFACES";
  position:absolute;
  right:40px;
  bottom:35px;
  z-index:5;
  color:rgba(255,255,255,.65);
  font-size:10px;
  letter-spacing:.3em;
  writing-mode:vertical-rl;
}

/* ---------- INTRO ---------- */

.intro{
  min-height:90vh;
  display:flex;
  align-items:center;
  background:#f7f4ee;
}

.intro h2{
  font-size:clamp(60px,7vw,110px);
  letter-spacing:-.065em;
}

.intro-text{
  font-size:20px;
  max-width:600px;
}

/* ---------- FULL BLEED TRANSITIONS ---------- */

.piscinas,
.materia,
.proyectos{
  position:relative;
  overflow:hidden;
}

.piscina-grid,
.materia-grid,
.proyecto{
  transition:transform .8s cubic-bezier(.16,1,.3,1);
}

.piscina-photo img,
.materia-photo img,
.proyecto-photo img{
  transition:
    transform 1.4s cubic-bezier(.16,1,.3,1),
    filter 1s ease;
}

.piscina-photo:hover img,
.materia-photo:hover img,
.proyecto-photo:hover img{
  transform:scale(1.06);
}

/* ---------- SECTION HEADINGS ---------- */

.piscina-copy h2,
.materia-copy h2,
.proyectos h2,
.origen h2{
  font-size:clamp(65px,7vw,110px);
  letter-spacing:-.065em;
}

/* ---------- CALCULATOR ---------- */

.calculadora-piscina{
  border-radius:0;
  position:relative;
  overflow:hidden;
  box-shadow:0 30px 100px rgba(20,30,25,.16);
}

.calculadora-piscina:before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  right:-200px;
  top:-250px;
  background:rgba(255,255,255,.05);
}

.calculadora-form{
  border-radius:0;
  box-shadow:0 25px 80px rgba(0,0,0,.12);
}

.calculadora-form input,
.calculadora-form select{
  transition:
    border .25s ease,
    box-shadow .25s ease,
    transform .25s ease;
}

.calculadora-form input:focus,
.calculadora-form select:focus{
  outline:none;
  border-color:#53655d;
  box-shadow:0 0 0 4px rgba(83,101,93,.1);
  transform:translateY(-1px);
}

/* ---------- COLLECTION ---------- */

.coleccion-wow{
  padding:180px 0;
  background:#171f1c;
  color:#fff;
  position:relative;
  overflow:hidden;
}

.coleccion-wow:before{
  content:"MATERIAL";
  position:absolute;
  font-size:clamp(180px,25vw,420px);
  font-weight:700;
  letter-spacing:-.08em;
  color:rgba(255,255,255,.025);
  white-space:nowrap;
  top:40px;
  left:-20px;
  pointer-events:none;
}

.coleccion-wow .eyebrow{
  color:#aebdb5;
}

.coleccion-wow h2{
  color:#fff;
  font-size:clamp(65px,7vw,115px);
}

.coleccion-wow p{
  color:#adb8b3;
}

.wow-categorias{
  grid-template-columns:repeat(12,1fr);
  gap:4px;
}

.wow-cat{
  min-height:500px;
  grid-column:span 4;
  border-radius:0;
  transition:
    transform .7s cubic-bezier(.16,1,.3,1),
    filter .7s ease;
}

.wow-cat:nth-child(1),
.wow-cat:nth-child(4){
  grid-column:span 6;
}

.wow-cat:nth-child(2),
.wow-cat:nth-child(3),
.wow-cat:nth-child(5),
.wow-cat:nth-child(6){
  grid-column:span 3;
}

.wow-cat:hover{
  transform:translateY(-8px);
  z-index:3;
}

.wow-cat-title{
  font-size:clamp(28px,3vw,46px);
  letter-spacing:-.04em;
}

.wow-cat-plus{
  font-size:40px;
  font-weight:100;
  transition:transform .4s ease;
}

.wow-cat:hover .wow-cat-plus{
  transform:rotate(90deg);
}

.wow-cat-overlay{
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.05),
      rgba(0,0,0,.8)
    );
}

/* ---------- PRODUCT GRID ---------- */

.wow-productos-head{
  border-color:rgba(255,255,255,.15);
}

.wow-volver{
  color:#fff;
}

.productos-grid{
  gap:4px;
}

.producto-card{
  border:0;
  background:#202a26;
  color:#fff;
  transition:
    transform .6s cubic-bezier(.16,1,.3,1),
    background .4s ease;
}

.producto-card:hover{
  transform:translateY(-7px);
  background:#28332e;
}

.producto-card-photo{
  aspect-ratio:1/1;
}

.producto-card-body{
  padding:32px;
}

.producto-card h3{
  color:#fff;
  font-size:42px;
}

.producto-card p,
.producto-meta{
  color:#aeb8b3;
}

.producto-card .button{
  background:#fff;
  color:#26352f;
}

/* ---------- ORIGEN MANIFESTO ---------- */

.origen{
  min-height:100vh;
  display:flex;
  align-items:center;
  background:#f5f1e9;
  position:relative;
  overflow:hidden;
}

.origen:before{
  content:"O";
  position:absolute;
  right:-5vw;
  top:50%;
  transform:translateY(-50%);
  font-size:60vw;
  line-height:.7;
  color:rgba(52,71,63,.035);
  font-family:Georgia,serif;
}

.origen-inner{
  position:relative;
  z-index:2;
}

.origen h2{
  max-width:1100px;
}

.origen p{
  font-size:clamp(20px,2vw,28px);
}

/* ---------- CONTACT ---------- */

.contacto{
  min-height:80vh;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.contacto:before{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  border-radius:50%;
  right:-250px;
  top:-250px;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:
    0 0 0 80px rgba(255,255,255,.025),
    0 0 0 160px rgba(255,255,255,.02);
}

.contacto h2{
  font-size:clamp(70px,9vw,150px);
  letter-spacing:-.07em;
}

/* ---------- REVEAL ---------- */

.wow-reveal{
  opacity:0;
  transform:translateY(50px);
  transition:
    opacity 1s cubic-bezier(.16,1,.3,1),
    transform 1s cubic-bezier(.16,1,.3,1);
}

.wow-reveal.wow-visible{
  opacity:1;
  transform:translateY(0);
}

/* ---------- MOBILE ---------- */

@media(max-width:900px){

  header{
    height:70px;
  }

  .hero-copy{
    padding:0 25px;
  }

  .hero h1{
    font-size:clamp(62px,16vw,100px);
  }

  .hero:before{
    right:18px;
    bottom:20px;
  }

  .wow-categorias{
    grid-template-columns:1fr;
  }

  .wow-cat,
  .wow-cat:nth-child(1),
  .wow-cat:nth-child(2),
  .wow-cat:nth-child(3),
  .wow-cat:nth-child(4),
  .wow-cat:nth-child(5),
  .wow-cat:nth-child(6){
    grid-column:span 1;
    min-height:380px;
  }

  .coleccion-wow{
    padding:100px 0;
  }

  .contacto h2{
    font-size:65px;
  }
}

@media(max-width:600px){

  .wow-cursor,
  .wow-cursor-ring{
    display:none;
  }

  .hero{
    height:100svh;
    min-height:700px;
  }

  .hero-copy{
    background:
      linear-gradient(
        180deg,
        rgba(10,18,15,.2),
        rgba(10,18,15,.72)
      );
    justify-content:flex-end;
    padding-bottom:80px;
  }

  .hero-subtitle{
    font-size:27px;
  }

  .intro{
    min-height:auto;
    padding:100px 0;
  }

  .intro h2{
    font-size:58px;
  }

  .origen{
    min-height:auto;
    padding:120px 0;
  }
}
