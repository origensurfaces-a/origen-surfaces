<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORIGEN SURFACES | Superficies · Materiales · Soluciones</title>

<meta name="description" content="ORIGEN SURFACES. Superficies, materiales y soluciones para transformar espacios.">

<style>
:root{
  --fondo:#f7f4ee;
  --fondo-verde:#eef1ec;
  --verde:#34473f;
  --verde-suave:#53655d;
  --texto:#41423e;
  --arena:#e6ddce;
  --blanco:#fffdf9;
  --linea:rgba(52,71,63,.16);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--fondo);
  color:var(--texto);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1320px,calc(100% - 100px));
  margin:auto;
}

/* =========================
   NAV
========================= */

header{
  height:96px;
  border-bottom:1px solid var(--linea);
  background:rgba(247,244,238,.96);
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:var(--verde);
  font-weight:700;
  font-size:25px;
  letter-spacing:.30em;
  line-height:1;
}

.logo span{
  display:block;
  font-size:9px;
  letter-spacing:.48em;
  margin-top:10px;
}

.menu{
  display:flex;
  gap:40px;
  color:#666862;
  font-size:15px;
}

.menu a{
  transition:.25s ease;
}

.menu a:hover{
  color:var(--verde);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:calc(100vh - 96px);
  display:grid;
  grid-template-columns:1fr 1fr;
}

.hero-copy{
  padding:110px 9%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(135deg,#f7f4ee 0%,#eee8dc 100%);
}

.eyebrow{
  font-size:12px;
  letter-spacing:.38em;
  color:#64746d;
  margin-bottom:32px;
}

h1,
h2,
h3{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  color:var(--verde);
}

.hero h1{
  font-size:clamp(58px,6vw,94px);
  line-height:.92;
  letter-spacing:-.045em;
  max-width:650px;
}

.hero h1 em,
h2 em{
  font-style:italic;
}

.hero-subtitle{
  font-family:Georgia,"Times New Roman",serif;
  font-size:34px;
  line-height:1.12;
  color:#344b56;
  margin:42px 0 28px;
  max-width:500px;
}

.hero-text{
  max-width:590px;
  font-size:17px;
  color:#5f6561;
  margin-bottom:38px;
}

.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:max-content;
  min-height:54px;
  padding:0 30px;
  background:var(--verde-suave);
  color:white;
  font-size:12px;
  letter-spacing:.17em;
  transition:.25s ease;
}

.button:hover{
  background:var(--verde);
  transform:translateY(-2px);
}

.hero-photo{
  height:calc(100vh - 96px);
  min-height:calc(100vh - 96px);
  background:#e8e3da;
  overflow:hidden;
}

.hero-photo img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
}

/* =========================
   INTRO
========================= */

.intro{
  padding:150px 0;
  background:var(--blanco);
}

.intro-grid{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:100px;
  align-items:start;
}

.intro h2{
  font-size:clamp(46px,5vw,78px);
  line-height:.98;
  letter-spacing:-.04em;
}

.intro-text{
  max-width:650px;
  font-size:19px;
  line-height:1.75;
  color:#656963;
  padding-top:15px;
}

/* =========================
   PISCINAS
========================= */

.piscinas{
  background:var(--fondo-verde);
  padding:130px 0;
}

.piscina-grid{
  display:grid;
  grid-template-columns:1.05fr 1fr;
  min-height:650px;
  align-items:stretch;
}

.piscina-photo{
  min-height:650px;
  overflow:hidden;
}

.piscina-copy{
  background:#e9eee9;
  padding:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.piscina-copy .eyebrow{
  margin-bottom:25px;
}

.piscina-copy h2{
  font-size:clamp(48px,5vw,76px);
  line-height:.98;
  letter-spacing:-.045em;
  max-width:600px;
}

.piscina-copy p{
  max-width:580px;
  margin:35px 0;
  color:#59615d;
  font-size:17px;
}

/* =========================
   CALCULADORA ORIGEN
========================= */

.calculadora-piscina{
  margin-top:80px;
  padding:90px 70px;
  background:var(--verde);
  color:var(--blanco);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:start;
}

.calculadora-intro{
  max-width:620px;
}

.calculadora-intro .eyebrow{
  color:#b8c9c0;
  margin-bottom:25px;
}

.calculadora-intro h2{
  color:white;
  font-size:clamp(48px,5vw,76px);
  line-height:.98;
  letter-spacing:-.045em;
  margin:0 0 30px;
}

.calculadora-intro p{
  max-width:520px;
  color:#dce5e0;
  font-size:18px;
  line-height:1.6;
}

.calculadora-form{
  background:#eef2ee;
  color:var(--texto);
  padding:45px;
  display:flex;
  flex-direction:column;
  gap:25px;
}

.campo{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.campo label{
  font-size:15px;
  letter-spacing:.02em;
}

.campo input,
.campo select{
  width:100%;
  padding:16px 18px;
  border:1px solid #c9d1cc;
  border-radius:0;
  background:#fff;
  color:var(--texto);
  font-family:inherit;
  font-size:16px;
}

.campo span{
  font-size:13px;
  color:#6b7771;
}

.calculadora-form .button{
  border:0;
  cursor:pointer;
  width:100%;
}

.error-calculadora{
  display:none;
  padding:15px;
  background:#f4dddd;
  color:#7b2d2d;
  font-size:14px;
}

.resultado-piscina{
  grid-column:1 / -1;
  background:#f7f4ee;
  color:var(--texto);
  padding:45px;
  display:none;
}

.resultado-piscina.activo{
  display:block;
}

.resultado-titulo{
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:30px;
  color:#597068;
}

.resultado-datos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px;
  margin-bottom:35px;
}

.resultado-datos div{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.resultado-datos span{
  font-size:13px;
  color:#69756f;
}

.resultado-datos strong{
  font-size:25px;
  font-weight:500;
}

/* =========================
   MATERIA
========================= */

.materia{
  padding:140px 0;
  background:var(--blanco);
}

.materia-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:80px;
  align-items:stretch;
}

.materia-photo{
  min-height:650px;
  background:#e7e1d5;
  overflow:hidden;
}

.materia-copy{
  background:var(--arena);
  padding:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.materia-copy h2{
  font-size:clamp(50px,5vw,80px);
  line-height:.96;
  letter-spacing:-.045em;
}

.materia-copy p{
  margin-top:38px;
  max-width:500px;
  color:#666b65;
  font-size:17px;
}

/* =========================
   PROYECTOS
========================= */

.proyectos{
  padding:140px 0;
  background:#f1eee8;
}

.proyectos-head{
  margin-bottom:55px;
}

.proyectos h2{
  font-size:clamp(50px,5vw,76px);
  line-height:1;
}

.proyecto{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  min-height:600px;
}

.proyecto-photo{
  min-height:600px;
  overflow:hidden;
}

.proyecto-copy{
  background:var(--verde);
  color:white;
  padding:70px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
